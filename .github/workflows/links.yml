name: Check links

# check-links.sh always checks every link in the repo — both the publication
# gate inside site/ and the weaker "points at something real" rule for
# README.md, CLAUDE.md and work/. Splitting it into per-workflow modes was the
# alternative; checking everything on every run is harder to slip past, so the
# workflow is named for what the script does rather than for the paths that
# trigger it. Expect a run here to fail on a broken link in site/ too.
#
# pages.yml runs the same script and then deploys. This one exists so that a
# change to README.md, CLAUDE.md or work/ is checked at all — those paths do not
# trigger pages.yml, and they should not: editing a README must never publish
# the handbook.
#
# The pull_request trigger is deliberately unfiltered while the push trigger
# keeps its paths. The branch ruleset on main requires this job, and a required
# check that never starts leaves a pull request waiting forever — a site/-only
# change would have been unmergeable. Running the script on every pull request
# costs seconds and makes the gate real; the script checks the whole repo
# anyway, so there is nothing it would have skipped.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'work/**'
      - '.github/scripts/check-links.sh'
      - '.github/workflows/links.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check every link in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./.github/scripts/check-links.sh
